[advisories]
ignore = [
    # `ark-relations` pulls in `tracing-subscriber 0.2.25`, but this is an
    # optional dependency path from the lockfile rather than a used runtime path.
    "RUSTSEC-2025-0055",
    # quick-xml 0.39.4 is pulled in by inferno 0.12.6.
    # TODO: remove these ignores once inferno is updated to a fixed quick-xml range.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # optional revm pulls in crypto-bigint 0.5; we only use it to verify public
    # inputs, without secret-key signing.
    # TODO: remove this ignore once the elliptic-curve dependencies are upgraded.
    "RUSTSEC-2026-0387",
]
